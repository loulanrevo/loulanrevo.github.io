# Hexo 多语言配置
# 生成多语言版本 (默认中文 / , 英文 /en/ , 日文 /ja/)
hexo-multiple-language:
  # ===== 默认语言（中文） =====
  default-language:
    "generate-dir": "public"
    "config-file-name":
      - "config.zh"
      - "config.butterfly.zh"

  # ===== 其他语言 =====
  other-language:
    - "enable": true
      "generate-dir": "public-en"
      "language-path": "en"
      "config-file-name":
        - "config.en"
        - "config.butterfly.en"
    - "enable": true
      "generate-dir": "public-ja"
      "language-path": "ja"
      "config-file-name":
        - "config.ja"
        - "config.butterfly.ja"

  # ===== 自动语言切换 =====
  switch-language:
    enable: true
    support-theme: "config.butterfly"
    storage-ttl: 86400000
    not-matched-use: "zh"
    default-language:
      - "zh"
      - "zh-CN"
      - "zh-TW"
      - "zh-HK"
    other-language:
      "en":
        - "en"
        - "en-US"
        - "en-GB"
      "ja":
        - "ja"
        - "ja-JP"
